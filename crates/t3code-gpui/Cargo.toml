[package]
name = "t3code-gpui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
clap.workspace = true
chrono = "=0.4.45"
html-escape = "=0.2.15"
icu_calendar = "=2.4.0"
icu_datetime = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = "=2.4.0"
sys-locale = "=0.3.2"
gpui-kit = { version = "=0.9.1", features = ["syntect"] }
humantime = "2.4"
markdown = "1.0.0"
regex = "=1.13.1"
serde_json.workspace = true
serde.workspace = true
t3-client = { path = "../t3-client" }
t3-terminal = { path = "../t3-terminal" }
notify-rust = "4.19"
tokio.workspace = true
uuid.workspace = true

[features]
gpui-fast = ["gpui-kit/gpui-fast"]

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
chrono-tz = "=0.10.4"
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12" }
