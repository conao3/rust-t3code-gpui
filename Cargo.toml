[workspace]
resolver = "3"
members = ["crates/t3-client", "crates/t3-terminal", "crates/t3code-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "2.5"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.29.2", features = ["v4"] }

[profile.release]
debug = 1

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
gpui-component = { path = "vendor/gpui-component" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre = { path = "vendor/gpui-pre" }
