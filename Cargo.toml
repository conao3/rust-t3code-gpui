[workspace]
resolver = "3"
members = ["crates/t3-client", "crates/t3code-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "2.5"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.27.0", features = ["v4"] }

[profile.release]
debug = 1

[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
