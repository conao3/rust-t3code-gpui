name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.5
      - run: nix develop --command make check
      - run: rm -rf target
      - run: nix build
